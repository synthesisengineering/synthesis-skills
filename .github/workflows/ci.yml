name: CI

# The only release gate (R7.3): core tests, every skill's tests (collected from all of
# skills/, beside scripts or in tests/) and the source lint, within the 10-minute budget,
# on Linux and macOS, including the Python 3.9 Apple ships as /usr/bin/python3. The suite
# runs in three jobs for each system and Python, tests/ in two halves and skills/, so no job
# nears the limit even on a slow runner.
# tests/test_source_lint.py fails if any test_*.py under skills/ would not be collected.

on:
  pull_request:
  push:
    branches: [main, v5]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        # What `python3 -m pytest -q tests/ skills/` runs, in three jobs: the core's tests in two halves by file
        # name, and the skills'. On 2026-11-12 the whole suite took 526 seconds on a macOS runner and one job was
        # cancelled at the ten-minute limit with no test failing; as two jobs, the core's tests took 6 minutes on
        # one macOS runner and over 10 on a slower one beside it. A lint test holds that no test file is missed.
        part: ["tests/test_[a-g]*.py", "tests/test_[h-z]*.py", "skills/"]
        include:
          # Apple's own /usr/bin/python3 (3.9), the oldest Python the plugin runs on. Until 2026-11-11 a Linux job on
          # setup-python's 3.9 stood in for it. That day apt on the two images that still have a 3.9 build
          # (ubuntu-22.04 and ubuntu-24.04) could resolve no mirror, so the job died installing bubblewrap before any
          # test, and the newest image has no 3.9 build at all. macOS needs no apt and has the interpreter itself.
          - os: macos-latest
            python: apple
            part: "tests/test_[a-g]*.py"
          - os: macos-latest
            python: apple
            part: "tests/test_[h-z]*.py"
          - os: macos-latest
            python: apple
            part: "skills/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python != 'apple'
        with:
          python-version: ${{ matrix.python }}
      - name: Apple's /usr/bin/python3 as `python`
        if: matrix.python == 'apple'
        run: |
          /usr/bin/python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 9), "Apple no longer ships Python 3.9: the floor this job checks has moved"'
          mkdir -p "$RUNNER_TEMP/apple-python"
          printf '#!/bin/sh\nexec /usr/bin/python3 "$@"\n' > "$RUNNER_TEMP/apple-python/python"  # a link would break Xcode's shim
          chmod +x "$RUNNER_TEMP/apple-python/python"
          echo "$RUNNER_TEMP/apple-python" >> "$GITHUB_PATH"
      - name: The test runner, with a floor
        # pip goes back to an older release when it cannot resolve the newest one's dependencies. On 2026-11-11 one
        # job got pytest 8.3.5 that way, and a test that needs 9 failed on main. With a floor the install fails here.
        run: python -m pip install "pytest>=9; python_version >= '3.10'" "pytest>=8.4; python_version < '3.10'"
      - name: OS sandbox for the local-messaging tests (macOS ships sandbox-exec)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks the unprivileged user namespace bwrap needs; an image without the switch needs nothing.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --die-with-parent --unshare-all --ro-bind / / true
      - name: Chrome's headless shell for the decision-packet browser tests
        # Full Chrome's headless mode hangs on --dump-dom of the packet page; the shell does not.
        shell: bash
        run: |
          browser=$(npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/browsers" | tail -n 1 | awk '{print $NF}')
          test -x "$browser"
          echo "SYNTHESIS_TEST_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: The knowledge-base connector's pinned requirements, for its sign-in and access-list tests
        # The lock is resolved for Python 3.12 and newer, so the 3.9 job skips those tests; every other job runs them.
        if: matrix.python != 'apple'
        run: |
          python -m pip install --require-hashes --no-deps -r skills/synthesis-kb-distribution/scripts/connector/requirements.txt
          echo "SYNTHESIS_REQUIRE_FASTMCP=1" >> "$GITHUB_ENV"
      - name: One half of the core's tests, or every skill's tests, wherever they live
        run: python -m pytest -q ${{ matrix.part }}
        env:
          SYNTHESIS_REQUIRE_SANDBOX: "1"  # sandbox tests fail instead of skipping
          SYNTHESIS_REQUIRE_CHROMIUM: "1"  # browser tests fail instead of skipping

  ci:
    # The one check branch protection requires on main and stable: it runs after every test job, even when one fails,
    # and passes only when all of them passed, so the matrix can change without touching the repository's settings.
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.test.result }}" = success
