name: CI

# The only release gate (R7.3): core tests, every skill's tests (collected from all of
# skills/, beside scripts or in tests/) and the source lint, within the 10-minute budget,
# on Linux and macOS, including the Python 3.9 Apple ships as /usr/bin/python3.
# tests/test_source_lint.py fails if any test_*.py under skills/ would not be collected.

on:
  pull_request:
  push:
    branches: [main, v5]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        include:
          # On the same image as the other Linux jobs. It ran on ubuntu-22.04 until 2026-11-11, when apt there could
          # resolve no mirror for over an hour and the job never reached a test.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: OS sandbox for the local-messaging tests (macOS ships sandbox-exec)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks the unprivileged user namespace bwrap needs; an image without the switch needs nothing.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --die-with-parent --unshare-all --ro-bind / / true
      - name: Chrome's headless shell for the decision-packet browser tests
        # Full Chrome's headless mode hangs on --dump-dom of the packet page; the shell does not.
        shell: bash
        run: |
          browser=$(npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/browsers" | tail -n 1 | awk '{print $NF}')
          test -x "$browser"
          echo "SYNTHESIS_TEST_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: The knowledge-base connector's pinned requirements, for its sign-in and access-list tests
        # The lock is resolved for Python 3.12 and newer, so the 3.9 job skips those tests; every other job runs them.
        if: matrix.python != '3.9'
        run: |
          python -m pip install --require-hashes --no-deps -r skills/synthesis-kb-distribution/scripts/connector/requirements.txt
          echo "SYNTHESIS_REQUIRE_FASTMCP=1" >> "$GITHUB_ENV"
      - name: Core tests, source lint and every skill's tests, wherever they live
        run: python -m pytest -q tests/ skills/
        env:
          SYNTHESIS_REQUIRE_SANDBOX: "1"  # sandbox tests fail instead of skipping
          SYNTHESIS_REQUIRE_CHROMIUM: "1"  # browser tests fail instead of skipping

  ci:
    # The one check branch protection requires on main and stable: it runs after every test job, even when one fails,
    # and passes only when all of them passed, so the matrix can change without touching the repository's settings.
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.test.result }}" = success
