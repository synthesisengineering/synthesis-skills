name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python skills/synthesis-agent-conformance/scripts/conformance.py source
      - run: python -m pytest skills/synthesis-agent-conformance/scripts/test_conformance.py -q
      - run: sh -n install.sh tests/test_installer.sh
      - run: ./tests/test_installer.sh
      - run: python -m compileall -q skills
      - run: python skills/synthesis-inbox-cleanup/tests/run_poisoned.py
      - run: python skills/synthesis-inbox-cleanup/tests/run_resolver.py
