name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      # PRINCIPAL RULE (controlling plan D4): the event base must exist in the
      # runner repository before the receipt consumer can derive its universe.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema
      - name: Install OS isolation for executable consumer acceptance
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          python .github/scripts/check-ci-sandbox.py
          synthesis_ci_chromium="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$synthesis_ci_chromium"
          "$synthesis_ci_chromium" --version
          echo "SYNTHESIS_TEST_CHROMIUM=$synthesis_ci_chromium" >> "$GITHUB_ENV"
      - run: python skills/synthesis-agent-conformance/scripts/conformance.py source
      - run: python skills/synthesis-agent-conformance/scripts/conformance.py instructions --repo-root .
      - run: python -m pytest skills/synthesis-agent-conformance/scripts/test_*.py -q
      - run: python -m pytest skills/synthesis-project-management/scripts/ -q
      - run: python -m pytest skills/synthesis-checkpoint/scripts/ -q
      - run: python skills/synthesis-skills-manager/scripts/release_check_groups.py --group state
      - run: python skills/synthesis-skills-manager/scripts/release_check_groups.py --group native
      - run: python skills/synthesis-skills-manager/scripts/release_check_groups.py --group evaluation
      - run: python skills/synthesis-skills-manager/scripts/release_check_groups.py --group core
      - run: python -m pytest skills/synthesis-model-tiers/scripts/ -q
      - run: python -m pytest skills/synthesis-promotion-gate/scripts/ -q
      - run: python -m pytest skills/synthesis-context-lifecycle/scripts/ skills/synthesis-implementation-integrity/scripts/ -q
      - name: Resolve acceptance change base
        # The manifest declares the TRANSACTION universe (release to release),
        # so push slices must be graded against the previous release tag, not
        # the push base. PRs keep their base: the PR slice is the universe
        # under review there. With no reachable release tag (pre-first-release
        # only), fall back to the event base.
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "SYNTHESIS_ACCEPTANCE_CHANGE_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            # RACE-GUARD-TEST-REGION-BEGIN — test_ci_runtime.py extracts and
            # executes this region verbatim against fixture repositories.
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              echo "SYNTHESIS_ACCEPTANCE_CHANGE_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
            else
              TAG_SHA=$(git rev-list -n 1 "$TAG")
              if [ "$TAG_SHA" = "$(git rev-parse HEAD)" ]; then
                # The release tag raced CI onto the remote: grading against it
                # would diff HEAD against itself (empty universe, R5 fails).
                # Step back to the previous release tag instead.
                TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG~1" 2>/dev/null || true)
                if [ -z "$TAG" ]; then
                  echo "SYNTHESIS_ACCEPTANCE_CHANGE_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
                else
                  echo "SYNTHESIS_ACCEPTANCE_CHANGE_BASE=$(git rev-list -n 1 "$TAG")" >> "$GITHUB_ENV"
                fi
              else
                echo "SYNTHESIS_ACCEPTANCE_CHANGE_BASE=$TAG_SHA" >> "$GITHUB_ENV"
              fi
            fi
            # RACE-GUARD-TEST-REGION-END
          fi
      - name: Consume transaction-bound R5 acceptance
        run: python skills/synthesis-skills-manager/scripts/release.py --repo-root . --acceptance-only
      - run: python -m pytest skills/synthesis-kb-edit/scripts/test_*.py skills/synthesis-okf/scripts/test_*.py -q
      - run: python -m pytest skills/synthesis-daily-rituals/scripts/test_*.py skills/synthesis-bitbucket/scripts/test_*.py skills/synthesis-message-guard/scripts/test_*.py skills/synthesis-git-hooks/scripts/test_*.py skills/synthesis-slack-sync/scripts/test_*.py skills/synthesis-chief-of-staff/scripts/test_*.py skills/synthesis-repo-guard/test_*.py skills/synthesis-decision-packet/scripts/test_*.py -q
      - run: python -m pytest skills/synthesis-onboarding/scripts/ -q
      - run: python skills/synthesis-onboarding/scripts/check_scaffolds.py .
      - run: python skills/synthesis-onboarding/scripts/check_capabilities.py .
      - run: python -m pytest skills/synthesis-skills-manager/scripts/test_release.py skills/synthesis-skills-manager/scripts/test_release_check_groups.py -q
      - run: python -m pytest skills/synthesis-agent-guardrails/tests/ -q
      # Standalone runner, not pytest: the file must stay executable from inside a
      # deployed skill directory, where pytest is not guaranteed to be installed.
      - run: python skills/synthesis-meeting-transcripts/test_verify_transcripts.py
      - run: python skills/synthesis-meeting-transcripts/test_transcript_primary.py
      - run: sh -n install.sh onboard.sh tests/test_installer.sh
      - run: ./tests/test_installer.sh
      - run: python -m compileall -q skills
      - run: python skills/synthesis-inbox-cleanup/tests/run_poisoned.py
      - run: python skills/synthesis-inbox-cleanup/tests/run_resolver.py
      - run: sh skills/synthesis-inbox-cleanup/tests/test_runtime_installer.sh

  onboarding-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Establish prescribed macOS framework interpreter
        if: runner.os == 'macOS'
        run: sh .github/scripts/install-ci-python.sh
      - run: python3 -m pip install pytest pyyaml jsonschema
      - run: python3 -m pytest skills/synthesis-onboarding/scripts/ -q
      - run: python3 skills/synthesis-onboarding/scripts/check_scaffolds.py .
      - run: python3 skills/synthesis-onboarding/scripts/check_capabilities.py .
      - run: sh -n onboard.sh
