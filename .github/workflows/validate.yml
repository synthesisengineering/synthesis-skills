name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      # PRINCIPAL RULE (controlling plan D4): the event base must exist in the
      # runner repository before the receipt consumer can derive its universe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema httpx
      - name: Install OS isolation for executable consumer acceptance
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap zsh
          /bin/zsh --version
          python .github/scripts/check-ci-sandbox.py
          synthesis_ci_chromium="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$synthesis_ci_chromium"
          "$synthesis_ci_chromium" --version
          echo "SYNTHESIS_TEST_CHROMIUM=$synthesis_ci_chromium" >> "$GITHUB_ENV"
      - name: Run the complete source catalog concurrently
        run: python skills/synthesis-skills-manager/scripts/release.py --repo-root . --source-checks-only

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      # PRINCIPAL RULE (controlling plan D4): the event base must exist in the
      # runner repository before the receipt consumer can derive its universe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema httpx
      - name: Install OS isolation for executable consumer acceptance
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap zsh
          /bin/zsh --version
          python .github/scripts/check-ci-sandbox.py
          synthesis_ci_chromium="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$synthesis_ci_chromium"
          "$synthesis_ci_chromium" --version
          echo "SYNTHESIS_TEST_CHROMIUM=$synthesis_ci_chromium" >> "$GITHUB_ENV"
      - name: Resolve acceptance change base
        # The event binds its exact review slice. release.py independently reads
        # published stable/version refs for the whole-release acceptance base.
        env:
          SYNTHESIS_EVENT_REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$SYNTHESIS_EVENT_REVIEW_BASE"
          echo "SYNTHESIS_ACCEPTANCE_CHANGE_BASE=$SYNTHESIS_EVENT_REVIEW_BASE" >> "$GITHUB_ENV"
      - name: Consume transaction-bound R5 acceptance
        id: acceptance
        env:
          SYNTHESIS_ACCEPTANCE_DIAGNOSTICS: ${{ runner.temp }}/synthesis-acceptance-diagnostics
        run: python skills/synthesis-skills-manager/scripts/release.py --repo-root . --acceptance-only --validation-output "${{ runner.temp }}/candidate-validation.json"
      - name: Retain candidate validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-validation
          path: ${{ runner.temp }}/candidate-validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain sanitized acceptance diagnostics
        if: always() && steps.acceptance.outputs.diagnostics_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-diagnostics
          path: |
            ${{ runner.temp }}/synthesis-acceptance-diagnostics/diagnostics.json
            ${{ runner.temp }}/synthesis-acceptance-diagnostics/manifest.json
          if-no-files-found: error
          retention-days: 7


  onboarding-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Establish prescribed macOS framework interpreter
        if: runner.os == 'macOS'
        run: sh .github/scripts/install-ci-python.sh
      - run: python3 -m pip install pytest pyyaml jsonschema httpx
      - name: Establish Linux sandbox for installed consumer acceptance
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap zsh
          python3 .github/scripts/check-ci-sandbox.py
      - run: python3 -m pytest skills/synthesis-onboarding/scripts/ -q
      - run: python3 skills/synthesis-onboarding/scripts/check_scaffolds.py .
      - run: python3 skills/synthesis-onboarding/scripts/check_capabilities.py .
      - run: sh -n onboard.sh
