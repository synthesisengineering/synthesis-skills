cases:
- id: handoff-sealed-loop
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_handoff.py::test_sealed_handoff_loop_is_harness_neutral_fleet_ac_11
  motivating_defect: Work moved across Macs by memory and copy-paste; the
    sealed loop must gate, offer, park, verify, claim, accept, and receipt
    identically for every destination lane.
- id: board-plane
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_board_plane.py::test_concurrent_cross_mac_claims_name_the_winner_fleet_ac_04
  motivating_defect: Concurrent cross-Mac claims could lose silently or
    blame paths; exactly one must land and the loser must see the
    winner's machine label and compact id.
- id: fleet-doctor
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_doctor.py::test_divergence_scan_catches_a_split_checkout
  motivating_defect: Split checkouts became push races; the doctor must
    catch divergence naming the repo and pass again once reunited.
- id: subscriptions
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_subscriptions.py::test_unsubscribed_paths_refuse_naming_machine_and_subscription
  motivating_defect: Any Mac could commit anywhere; the gate must refuse
    unsubscribed areas naming the machine and the needed subscription,
    with a logged explicit escape.
- id: bootstrap
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_bootstrap.py::test_full_bootstrap_then_safe_reran_noop
  motivating_defect: New-Mac setup was manual and unrepeatable; bootstrap
    must mint, clone, install, enroll, and verify once, then rerun as a
    no-op with receipts.
- id: machine-sync-registration
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_onboard.py::WholeSystemTests::test_every_hard_stop_has_a_real_scaffold
  motivating_defect: A skill outside the component catalog never installs;
    the machine-sync skill must be cataloged, manifested, and scaffold-clean.
- id: deployed-bundles
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-git-hooks/scripts/test_pre_commit.py::test_r4_installer_copies_coordination_runtime
  motivating_defect: A gate runtime missing its fleet modules fails closed
    on every commit; the installer must carry the whole engine universe.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
