schema: 2
suite: fleet-release-4-110-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.110.0, shipping flag-free fleet enrollment (zero-flag
  synthesis fleet join with GitHub discovery, role from shared state,
  live progress, and enrollment publish-back) on onboarding engine 2.6.0
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the real join, bootstrap, publish,
  and manifest checks in disposable directories. They do not establish
  installed-client reload, live cross-client delivery, new-release
  publication, or deployment approval. Those remain separate release checks.
