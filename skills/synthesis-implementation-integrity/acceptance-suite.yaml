schema: 2
suite: section3-ownership-visibility
membership: closed
production_entry_point: Owned items record once with owner stamps; a shared
  time-block layer carries real-title blocks across workspaces; one overlap
  pass reports cross-owner collisions; no calendar writes anywhere
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the real overlap script, routing
  reference checks, and stamp CLI against fixture layers. They do not
  establish live calendar reads, installed-client reload, new-release
  publication, or deployment approval. Those remain separate release checks.
