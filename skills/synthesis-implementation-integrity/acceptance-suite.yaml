unverified_remainder: The fixtures execute gate, landing, workflow-shape, and
  scaffold checks against fixtures and the working tree. They do not establish
  installed-client reload, live cross-client delivery, new-release publication,
  or deployment approval. Those remain separate release checks. The SKILL.md
  and agent descriptor prose rides the release-metadata vehicle; review is the
  evidence of prose adoption. Live CI greenness on the release push is the
  evidence the base fix works in its environment, observed after publication.
