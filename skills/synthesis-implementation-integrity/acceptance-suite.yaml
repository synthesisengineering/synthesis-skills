cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid. The registry prose rides this vehicle; review
    is the evidence of prose adoption.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: registry-placeholders-and-modes
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-slack-sync/scripts/test_slack_workspaces.py::RegistryTest
  motivating_defect: One human with several Slack workspaces had no per-machine
    registry, so tokens lived only in the client, placeholders were
    indistinguishable from misconfiguration, and unified versus isolated
    visibility was a conversation rather than a setting. The registry names
    every workspace, resolves each token to ready/placeholder/missing/
    rejected/external without ever storing a secret, and gates syncs on the
    readable set for the session workspace under the declared mode.
