schema: 2
suite: slack-mw-registry-4-143-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.143.0, shipping the multi-workspace Slack registry with
  placeholder tokens and the unified/isolated visibility doctrine.
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: The fixtures execute release-contract, registry,
  and manifest checks against fixtures and the working tree. They do not establish
  live Slack reads (no workspace tokens are installed), installed-client reload,
  live cross-client delivery, new-release publication,
  launcher refresh, or deployment approval. Those remain separate release
  checks. The doctrine, token-guide, and skill prose ride the
  release-metadata vehicle; review is the evidence of prose adoption. The full slack-sync
  suite runs in the required pytest checks alongside this receipt.
