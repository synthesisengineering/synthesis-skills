cases:
- id: stale-launcher
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_client_binaries.py::test_failed_path_launcher_falls_back_to_working_bundle
  motivating_defect: An executable stale launcher must not hide a usable CLI.
- id: probe-timeout
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_client_binaries.py::test_hung_candidate_is_bounded_and_its_child_is_reaped
  motivating_defect: Hung local probes and their process groups are bounded.
- id: probe-cleanup
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_client_binaries.py::test_unconfirmed_probe_cleanup_cannot_report_success
  motivating_defect: Unconfirmed cleanup cannot establish a healthy candidate.
- id: override
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_client_binaries.py::test_explicit_broken_override_never_selects_another_install
  motivating_defect: A discovered alternative cannot override an explicit selection.
- id: dispatch
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_codex_dispatch.py::test_dispatch_discovery_honors_explicit_absence
  motivating_defect: Dispatch honors explicit absence through canonical discovery.
- id: onboarding
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_client_discovery.py::test_onboard_skips_failed_path_launcher
  motivating_defect: The actual onboarding resolver rejects stale PATH launchers.
- id: direct-copy
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_client_discovery.py::test_direct_copy_discovery_uses_packaged_resolver
  motivating_defect: The direct-copy consumer uses the same runtime dependency.
- id: installed-layout
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_independent_review.py::test_engine_materializes_organization_instructions_from_an_installed_release
  motivating_defect: Installed release dependencies support actual organization setup.
- id: release-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: Release metadata and archive contract agree.
- id: relative_explicit_override_runs_selected_file
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_client_binaries.py::test_relative_explicit_override_runs_selected_file
  motivating_defect: relative explicit override runs selected file
- id: unconfirmed_cleanup_stops_entire_discovery
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_client_binaries.py::test_unconfirmed_cleanup_stops_entire_discovery
  motivating_defect: unconfirmed cleanup stops entire discovery
- id: unconfirmed_wait_stops_before_next_candidate
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_client_binaries.py::test_unconfirmed_wait_stops_before_next_candidate
  motivating_defect: unconfirmed wait stops before next candidate
- id: onboard-version-parity
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_synthesis_cli.py::test_engine_versions_and_skill_contract_agree
  motivating_defect: Both runtime entry points and the skill must declare the same
    onboarding version.
- id: copy-retained-client
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_native_failure_boundary.py::test_copy_preserves_unselected_native_client_copies
  motivating_defect: A complete direct-copy fixture preserves an unselected native
    client.
