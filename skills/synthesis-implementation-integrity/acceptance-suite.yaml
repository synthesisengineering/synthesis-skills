schema: 2
suite: ecosystem-reliability-2026-09-09
membership: closed
production_entry_point: Declared-source deadline collector, shared plan and record helpers, native checkpoint
  hooks and exact-session retirement CLI
enforcing_boundary: release.py derives exact Git changed paths and consumes fresh transaction-bound acceptance
  before source publication and both-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures use isolated transcripts, homes, Git repositories and local leases. They
  establish source behavior and refusal controls, not genuine native-client completion, arbitrary shell
  safety, real foreign-session recovery, multi-computer support or automatic adherence to prose claim
  guidance. Documentation is manually reviewed; associated behavior fixtures do not prove an agent followed
  instructions. Private publication-parser and currency-adapter changes have a separate private release
  receipt. Installed bytes and fresh native evidence require separate verification. This acceptance grants
  no website deployment, communication, automation, memory-setting change or foreign claim retirement
  authority.
