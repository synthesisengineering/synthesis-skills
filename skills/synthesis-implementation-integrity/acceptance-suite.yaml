schema: 2
suite: resume-name-addressed-4-124-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.124.0, making resume invocation name-addressed: the R1
  prompt is one sentence naming the skill and the workspace, with no
  filesystem path, client name, or release version.
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: The fixture executes the resume probe paths in a
  disposable directory. It does not establish installed-client reload,
  live cross-client delivery, new-release publication, or deployment
  approval. Those remain separate release checks.
changed_surfaces:
- path: .claude-plugin/plugin.json
  cases:
  - release-version-metadata
- path: .codex-plugin/plugin.json
  cases:
  - release-version-metadata
- path: .muse-plugin/plugin.json
  cases:
  - release-version-metadata
- path: CHANGELOG.md
  cases:
  - release-version-metadata
- path: README.md
  cases:
  - release-version-metadata
- path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
  cases:
  - manifest-validates
- path: skills/synthesis-project-resume/SKILL.md
  cases:
  - resume-name-addressed
- path: skills/synthesis-project-resume/references/requirements.md
  cases:
  - resume-name-addressed
- path: skills/synthesis-project-management/scripts/test_fleet_park.py
  cases:
  - fleet-time-anchored-fixture
cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: resume-name-addressed
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-resume/scripts/test_resume_probe.py::test_probe_reports_identity_and_goal
  motivating_defect: The R1 prompt embedded a client-specific,
    version-pinned filesystem path, so pasted prompts named one
    harness's cache and died on upgrade or cross-machine paste. The
    prompt now names the skill and the workspace only.
- id: fleet-time-anchored-fixture
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_park.py::test_bag_laptop_drill_fleet_ac_07
  motivating_defect: The drill fixture used a fixed T0 while
    downgraded() keys heartbeat age off the wall clock, so the
    blocking-overlap assertion flipped to advisory (and the suite
    to red) once the suite aged past the 2-day threshold. T0 is
    anchored to import time.
