schema: 2
suite: bug1-seat-snapshot-4-130-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.130.0, fixing the narrow/seat divergence and the
  activity-sensitive claim-identity snapshot.
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: The fixtures execute narrow, honor-pass, and snapshot
  paths against disposable board and repository fixtures. They do not
  establish installed-client reload, live cross-client delivery, new-release
  publication, or deployment approval. Those remain separate release checks.
  CONTRIBUTING.md and SUPPORT.md carry policy prose adopted by ruling
  (POL-1/POL-2); no executed fixture can evidence prose adoption — review
  is the evidence, recorded in the packet rulings — so they ride the
  release-metadata vehicle.
