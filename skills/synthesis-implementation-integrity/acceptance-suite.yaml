cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid. The hook-suite prose rides this vehicle; review is
    the evidence of prose adoption.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: pro3-hook-inert-unconfigured
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-guardrails/tests/test_hook_gates.py::test_hook_is_inert_when_unconfigured
  motivating_defect: PRO-3 — every promoted hook exits 0 silently with no
    hooks.json. A hook that acts without principal configuration would enforce
    nobody's rules.
- id: pro3-hook-doctor
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-guardrails/tests/test_hook_gates.py::test_hook_doctor_reports_hook_name
  motivating_defect: PRO-3 — every promoted hook answers --doctor with its
    name and state, so rituals can verify the fleet without running it.
- id: pro3-catalog-seams
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-guardrails/tests/test_hook_gates.py::test_catalog_parses_ack_signals_and_hints
  motivating_defect: PRO-3 — acknowledgment signals and rewrite hints live in
    the principal's catalog file, never hardcoded in the loader.
- id: pro3-catalog-empty-safe
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-guardrails/tests/test_hook_gates.py::test_catalog_empty_when_unconfigured
  motivating_defect: PRO-3 — an absent catalog means zero detections, never
    a crash.
- id: pro3-no-employer-or-principal-name
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-guardrails/tests/test_no_private_refs.py::test_no_employer_or_principal_name
  motivating_defect: PRO-3 purge — no employer or principal name survives in the promoted
    tree, proven with positive controls.
- id: pro3-bare-contract
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-guardrails/tests/test_bare_filename_detector.py::test_claude_input_contract_records_source_detector_result
  motivating_defect: PRO-3 — the promoted filename detector keeps its input
    contract at its new tree location.
- id: pro3-guard-blocks-unowned
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-guardrails/tests/test_installed_artifact_guard_owner.py::test_refusal_without_source_json_still_blocks_and_names_the_absence
  motivating_defect: PRO-3 — the install-guard sibling blocks artifacts with
    no provenance instead of crashing.
- id: pro3-repo-guard-fails-closed
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-guardrails/tests/test_repo_guard_stop.py::test_invalid_stop_payload_fails_closed
