schema: 2
suite: fleet-docs-public
membership: closed
production_entry_point: Public fleet documentation enrolls a second Mac
  (bootstrap CLI, receipts, rerun safety, per-machine sign-in), moves work
  between machines (park, seal, verify, claim, accept, resume), and covers
  daily care (fleet doctor, divergence drill, subscriptions, secrets
  rotation, leaving the fleet); every documented command and flag exists
  in the shipped engines
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the real bootstrap, handoff, and
  doctor modules in disposable homes, boards, and checkouts, pinning the
  documented commands and flags. Prose accuracy beyond the pinned commands,
  live two-Mac enrollment and handoff, installed-client reload, new-release
  publication, and deployment approval remain separate checks.
changed_surfaces:
- path: README.md
  cases:
  - docs-setup-commands-exist
  - docs-handoff-loop
  - docs-doctor-checks
- path: docs/fleet-handoff.md
  cases:
  - docs-handoff-loop
- path: docs/fleet-operations.md
  cases:
  - docs-doctor-checks
- path: docs/fleet-setup.md
  cases:
  - docs-setup-commands-exist
- path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
  cases:
  - manifest-validates
cases:
- id: docs-setup-commands-exist
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_bootstrap.py::test_full_bootstrap_then_safe_reran_noop
  motivating_defect: The setup doc's bootstrap command, receipt names, and
    rerun-noop promise must match the shipped CLI step for step.
- id: docs-handoff-loop
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_handoff.py::test_sealed_handoff_loop_is_harness_neutral_fleet_ac_11
  motivating_defect: The handoff doc's park, seal, verify, accept, and
    resume sequence must match the sealed engine loop for every lane.
- id: docs-doctor-checks
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_doctor.py::test_divergence_scan_catches_a_split_checkout
  motivating_defect: The operations doc's doctor gate and divergence drill
    must match the shipped checks and their failure wording.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
