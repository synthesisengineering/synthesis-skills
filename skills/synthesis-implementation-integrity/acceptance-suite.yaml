schema: 2
suite: seat-schema-containment-4-120-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.120.0, shipping project-management 2.17.0 (desktop checkpoint
  binding by machine label; strict seat-directory reads contain stale schema-1
  seat files and the doctor names them; park verifies death evidence and
  succeed moves a single resource off a parked row)
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the checkpoint matcher, the seat
  readers, the diagnostic inbox and the doctor in disposable directories.
  They do not establish installed-client reload, live cross-client delivery,
  new-release publication, or deployment approval. Those remain separate
  release checks.
