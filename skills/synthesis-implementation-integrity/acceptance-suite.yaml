schema: 2
suite: pro-3-hook-promotion
membership: closed
production_entry_point: The release promoting the per-client hook suite
  to the public synthesis-agent-guardrails skill with defaults-off
  enable gates, per-hook doctors, and principal-supplied detection
  catalogs.
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: The fixtures execute gate, doctor, catalog-seam, purge,
  and manifest checks against fixtures and the working tree. They do not establish
  installed-client reload, live cross-client delivery, new-release publication,
  launcher refresh, deployment approval, or the principal's purge review. Those
  remain separate release checks and the runbook gate. The SKILL.md prose rides
  the release-metadata vehicle; review is the evidence of prose adoption. The
  full 101-test guardrails suite runs in the pytest.guardrails required check
  alongside this receipt.
