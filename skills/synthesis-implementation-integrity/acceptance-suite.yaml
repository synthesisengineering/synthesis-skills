cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: desktop-seat-machine-binding
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_checkpoint_observer.py::test_schema2_seat_machine_id_and_label_bind_the_desktop_row
  motivating_defect: Schema-2 seats hold the fleet machine-id while the board
    row shows the label; comparing label to id refused every Claude desktop
    checkpoint on this machine since the seat-schema bump.
- id: strict-seat-containment
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_peer_addressing.py::test_strict_directory_read_contains_a_stale_schema1_seat_and_names_it
  motivating_defect: One stale pre-migration seat file made every strict read
    of the seat directory fail closed with no output; the file must be
    skipped and named while the valid seats still load.
- id: diagnostic-inbox-containment
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_board_inbox.py::test_diagnostic_inbox_survives_a_stale_schema1_seat_file
  motivating_defect: The SessionStart diagnostic exited 2 with zero context
    whenever a stale seat file existed, so the doctor reported nothing.
- id: doctor-stale-seats
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_peer_addressing.py::test_doctor_names_stale_seat_files_without_failing
  motivating_defect: A skipped file nobody names is a silent skip; the doctor
    lists each stale seat file so day-start can remove it.
- id: park-death-evidence
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_park.py::test_park_pid_gone_takes_a_pidless_seat_only_when_its_session_log_is_quiet[True]
  motivating_defect: An exited harness whose seat records no pid stayed
    live for two days; death must be proven locally (process gone, or
    session log and heartbeat both quiet) and recorded, never asserted.
- id: succeed-only-resource
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_coordination.py::test_succeed_only_moves_named_areas_from_a_parked_row_and_keeps_the_rest
  motivating_defect: Taking one resource (a release train) off a parked
    seat required an administrative release of its whole row; the named
    area moves with a notice the parked seat meets on resume.
