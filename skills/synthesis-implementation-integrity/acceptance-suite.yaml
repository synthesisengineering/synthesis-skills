schema: 2
suite: intakes-2026-09-14
membership: closed
production_entry_point: build_packet.py SPEC --strict-reader [--file-into DIR --date YYYY-MM-DD], record_rulings.py PASTE
  --file-into DIR, ritual_state.py query weekly-review --workspace W, and sync_watermark.py advance --through EPOCH
enforcing_boundary: release.py derives exact Git changed paths and consumes fresh transaction-bound acceptance
  before publication and both-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures establish that every decision-packet option label names a consequence, that the
  reader contract reports bare acknowledgements and labels sharing every content word as findings the strict
  reader turns into refusals naming the row and the accepted form, that each button carries its consequence,
  that --file-into writes the dated spec and page only into an existing directory, that record_rulings.py
  round-trips the pasted summary of a generated packet and of one captured from the real page into a rulings
  file and quotes what it refuses, that the weekly-review query answers for the named workspace only and refuses
  an unscoped call unless the log names exactly one workspace, that every ritual_state view honors --workspace,
  that advance and status accept epoch seconds and Slack's fractional ts and store every form canonically, and
  one coherent release read from the actual plugin manifests, CHANGELOG top heading and README release marker.
  They read skills/synthesis-decision-packet/SKILL.md only for the handoff path anchor; no fixture reads its
  consequence-labeling, --strict-reader or --file-into prose, which is bound through the cases that pin the
  behavior it documents. They read skills/synthesis-daily-rituals/SKILL.md for the watermark-gate invocation,
  the version labels, the line budget and the reference links; no fixture reads the scoped weekly-review
  command in Day-Start Step 1 or Day-End Step 10, and references/version-history.md is read only for its
  version headings and the anchors the moved-block fixture pins, not the v2.37.0 entry's body. No fixture reads
  the body text of the 4.99.0 README note or CHANGELOG entry beyond that marker and heading. The coverage
  coherence fixtures compare the pytest group lists in validate.yml, AGENTS.md and release.py; they do not
  execute the group, which CI and the release gate run. They do not establish native startup, complete agent
  reading, natural Stop, or multi-computer readiness. Installed and genuine native acceptance are separate.
