  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: preplan-credit
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-preplan/scripts/test_acknowledgments.py::test_acknowledgments_credit_the_proposer
  motivating_defect: A public credit given and then silently lost in a
    later edit breaks trust with the contributor; the pin keeps it.
- id: retention-default
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_project_format.py::test_cli_archive_defaults_to_year_retention
  motivating_defect: An archiver with no default never runs on its
    own; the year default must hold without the flag.
- id: prep-reader-profiles
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-meeting-prep/scripts/test_prep_init.py::test_add_reader_writes_profile
  motivating_defect: The per-person profile convention must exist in
    the scaffolder, not just in prose, or nobody adopts it.
- id: prep-forum-disclosure
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-meeting-prep/scripts/test_prep_lint.py::test_namedrop_opener_flagged_in_forum
  motivating_defect: The upward-vs-forum disclosure line must be
    mechanically enforced where it can be, not merely advised.
- id: prep-basis-honesty
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-meeting-prep/scripts/test_prep_lint.py::test_missing_basis_flagged
  motivating_defect: R13's fallback — say so in the pack when no
    sample exists — rides on the basis check refusing silent gaps.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: fleet-sync-command
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_fleet_sync.py::test_sync_full_run_current
  motivating_defect: A second Mac must come fully current from one
    command; the full-run fixture proves update, repos, heartbeat, and
    doctor pass together on a current machine.
- id: stale-seat-containment
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_checkpoint_observer.py::test_stale_seat_row_is_skipped_without_blocking_unrelated_checkpoint
