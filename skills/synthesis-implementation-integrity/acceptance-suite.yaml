schema: 2
suite: receipt-plugin-root-2026-09-16
membership: closed
production_entry_point: session_context.py SessionStart receipts under synthesis exec-public and the
  conformance hook-live plane
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and both-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures establish that plugin_identity prefers the client-exported plugin root when it
  carries a manifest and falls back to the execution root otherwise, that the receipt records the execution
  root, that hook-live accepts an execution root carrying the expected version and refuses a mismatched or
  manifest-less one, and one coherent release read from the actual manifests, CHANGELOG and README. They do
  not establish that either client exports the plugin root variable into hooks at runtime (evidence for that
  is the shared 4.99.0 hooks.json, which expanded the same variable in both clients); a fresh native
  SessionStart receipt after installation is the live proof, recorded in the project's session log.
changed_surfaces:
- path: .claude-plugin/plugin.json
  cases: [release-contract, release-surfaces-pinned, release-contract-version]
- path: .codex-plugin/plugin.json
  cases: [release-contract, release-surfaces-pinned, release-contract-version]
- path: CHANGELOG.md
  cases: [release-contract, release-surfaces-pinned, release-contract-changelog]
- path: README.md
  cases: [release-contract, release-surfaces-pinned]
- path: skills/synthesis-agent-conformance/SKILL.md
  cases: [release-contract]
- path: skills/synthesis-agent-conformance/scripts/conformance.py
  cases: [hook-live-execution-root]
- path: skills/synthesis-agent-conformance/scripts/session_context.py
  cases: [receipt-client-plugin-root, receipt-execution-root-fallback, receipt-records-execution-root]
- path: skills/synthesis-agent-conformance/scripts/test_conformance.py
  cases: [hook-live-execution-root]
- path: skills/synthesis-agent-conformance/scripts/test_session_context.py
  cases: [receipt-client-plugin-root, receipt-execution-root-fallback, receipt-records-execution-root]
- path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
  cases: [manifest-validates]
cases:
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The patch must declare its exact changed membership through the existing acceptance consumer.
- id: receipt-client-plugin-root
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_session_context.py::test_plugin_identity_prefers_the_client_provided_plugin_root
  motivating_defect: Under synthesis exec-public the script executes from the active release root, and at 4.100.0
    the receipt named that root as the plugin root; the client's exported plugin root must win when it carries
    a manifest, with the execution root recorded separately.
- id: receipt-execution-root-fallback
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_session_context.py::test_plugin_identity_falls_back_to_the_execution_root_without_a_client_root
  motivating_defect: Without a client-exported root, or with one that carries no manifest, the receipt keeps
    naming the execution root, which is today's behavior for direct runs and tests.
- id: receipt-records-execution-root
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_session_context.py::test_live_receipt_records_real_sessionstart_shape
  motivating_defect: The real-shape receipt must carry execution_root so hook-live can verify the executed tree.
- id: hook-live-execution-root
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_conformance.py::test_receipt_check_verifies_the_execution_root_carries_the_expected_version
  motivating_defect: A receipt whose execution root carries a different or missing plugin version means the hook
    ran code from another release than the client loaded; hook-live must refuse it and accept a matching one.
- id: release-contract
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_project_state.py::test_project_state_reliability_release_contract_is_coherent
  motivating_defect: Release metadata must describe one coherent release read from the actual files; both
    plugin versions agree, the CHANGELOG top heading carries that version, README notes Release **version**,
    and the reliability-tranche SKILL.md versions stay at or above their floors.
- id: release-surfaces-pinned
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_independent_review.py::test_release_surfaces_agree_and_public_commands_are_pinned
  motivating_defect: A second independent reader of the actual release surfaces; at 4.92.1 the README's native
    plugin commands still installed from the default branch instead of the stable ref.
- id: release-contract-version
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_source_version_agrees
  motivating_defect: Both client manifests must agree on one version before a release is described; this
    fixture exercises the boundary's parser on a synthetic repository; the shipped files are read by
    release-contract and release-surfaces-pinned.
- id: release-contract-changelog
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_changelog_top_version_parsed
  motivating_defect: The changelog's newest heading must parse as the version the boundary compares with both
    manifests; this fixture exercises the boundary's parser on a synthetic repository.
