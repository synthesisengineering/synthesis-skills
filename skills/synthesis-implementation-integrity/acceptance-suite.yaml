# AGENT HEURISTIC: authored for the 4.86.0 synthesis-quick-answers transaction.
# Fresh per transaction: changed_surfaces must equal the authoritative
# base-to-head Git diff before release.py can consume the receipt.
schema: 2
suite: add-synthesis-quick-answers-skill
membership: closed
production_entry_point: skills/synthesis-quick-answers/SKILL.md
enforcing_boundary: the new skill's defining feature (a source + Verified/Cached/Uncertain confidence trailer on every answer, reusing synthesis-grounding-discipline's cache-vs-truth vocabulary) is present in the shipped skill text, the skill is registered for both clients (SKILL.md plus its agents/openai.yaml), and every release-plumbing surface (both plugin manifests, CHANGELOG, README) agrees on version 4.86.0 before the release gate consumes this receipt
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: the new skill's actual behavior inside a live Claude Code or Codex session (question routing, live source verification, trailer formatting under real questions) is not exercised by this suite — only the shipped text's presence and cross-surface version coherence are checked; first real usage happens once a colleague stands up the pattern in their own workspace
changed_surfaces:
  - path: skills/synthesis-quick-answers/SKILL.md
    cases: [quick-answers-skill-release-contract]
  - path: skills/synthesis-quick-answers/agents/openai.yaml
    cases: [quick-answers-skill-release-contract]
  - path: skills/synthesis-onboarding/references/components.json
    cases: [quick-answers-skill-release-contract]
  - path: skills/synthesis-skills-manager/scripts/test_release.py
    cases: [quick-answers-skill-release-contract]
  - path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
    cases: [shipped-manifest-self-consumption]
  - path: .claude-plugin/plugin.json
    cases: [release-manifest-parity]
  - path: .codex-plugin/plugin.json
    cases: [release-manifest-parity]
  - path: CHANGELOG.md
    cases: [release-changelog-parity]
  - path: README.md
    cases: [release-changelog-parity]
cases:
  - id: quick-answers-skill-release-contract
    control_class: acceptance-test
    fixture: ../synthesis-skills-manager/scripts/test_release.py::test_quick_answers_skill_release_contract_is_public_and_coherent
    motivating_defect: a-skill-can-ship-with-its-defining-feature-undocumented-or-missing-the-codex-registration-file-every-other-skill-carries
  - id: shipped-manifest-self-consumption
    control_class: acceptance-test
    fixture: ../synthesis-implementation-integrity/scripts/test_acceptance_suite.py::test_shipped_manifest_validates
    motivating_defect: an-acceptance-manifest-that-its-own-runner-cannot-consume-issues-authority-it-never-earned
  - id: release-manifest-parity
    control_class: acceptance-test
    fixture: ../synthesis-skills-manager/scripts/test_release.py::test_source_version_agrees
    motivating_defect: a-version-that-reaches-only-one-client-manifest-cannot-be-reliably-installed-or-audited
  - id: release-changelog-parity
    control_class: acceptance-test
    fixture: ../synthesis-skills-manager/scripts/test_release.py::test_changelog_top_version_parsed
    motivating_defect: a-release-whose-changelog-disagrees-with-its-manifests-cannot-be-audited-later
