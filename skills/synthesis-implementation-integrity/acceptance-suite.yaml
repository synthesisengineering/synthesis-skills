schema: 2
suite: fleet-handoff-machine-sync
membership: closed
production_entry_point: Handoff moves work across Macs through a REMOTE_READY
  source gate, sealed ticketed offers, and a harness-neutral resume contract;
  logical repo identity spans checkout paths; the fleet doctor gates
  reachability, freshness, coherence, seals, and divergence; workspace
  subscriptions bind commits to machines; bootstrap provisions a new Mac
  idempotently; synthesis-machine-sync documents enroll, sync, leave,
  and handoff
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures run the real handoff, board, doctor,
  subscription, and bootstrap modules against disposable boards, lease
  remotes, git checkouts, and homes. Live two-Mac handoff, installed-client
  reload, new-release publication, and deployment approval remain separate
  release checks.
