cases:
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: claim-merge-union
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_coordination.py::test_reclaim_merges_areas_by_default
  motivating_defect: Re-claims from compacted contexts silently dropped
    areas by omission; merge-by-default grows, never shrinks.
- id: claim-narrow
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_coordination.py::test_narrow_releases_named_areas_and_reports
  motivating_defect: Shrinking must name its target and print a loud
    record, refusing targets the row does not hold.
- id: mailbox-blind
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-daily-rituals/scripts/test_mailboxes.py::test_unswept_due_accounts_are_blind_and_fail
  motivating_defect: Undeclared mailboxes rotted unread; due accounts
    neither swept nor deferred must fail the ritual loudly.
- id: commitments-scan
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-meeting-transcripts/test_extract_commitments.py::test_plaud_timestamp_is_captured
  motivating_defect: Filed transcripts were never read for obligations;
    commitment shapes surface timestamped for confirmation.
- id: transcript-version
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-meeting-transcripts/test_version_parity.py::test_executable_components_match_the_skill_version
