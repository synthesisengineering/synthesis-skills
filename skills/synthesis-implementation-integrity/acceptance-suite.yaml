schema: 2
suite: unified-installation-distribution-modular-4-101-0
membership: closed
production_entry_point: packages/launcher.sh and package_launcher.py delegate to onboard.sh, bootstrap.py and synthesis_cli.py
  modular lifecycle operations
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and both-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Existing fixtures use disposable homes, local repositories and simulated client/service executables.
  They do not establish installed-client reload, native live acceptance, hosted operating-system matrix results,
  network publication or deployment approval. The optional manual Arch recipe entrypoint is mapped to its shared
  adapter/checksum fixtures; makepkg and published AUR availability are not established. Public web deployments
  and real registry/tap/release-channel acceptance remain separate gates.
