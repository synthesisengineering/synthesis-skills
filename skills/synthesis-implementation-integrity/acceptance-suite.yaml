  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-daily-rituals/scripts/test_decay_sweep.py::test_explicit_identity_deduplicates_and_reasoned_redate_replaces
  motivating_defect: Carried items need explicit identity without conflating similar titles.
