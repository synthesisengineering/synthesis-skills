schema: 2
suite: fleet-release-4-111-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.111.0, shipping the one-command onboard dispatcher
  (detect, recommend, interview across install, upgrade, fleet join,
  workspaces, components, repair) with robust enrollment (label
  collisions, renames, concurrent publishes, atomic clones,
  fail-closed guards) on onboarding engine 2.7.0, plus the new
  open-source synthesis-meeting-prep skill v1.0.0 with its prep
  linter, registered in the component catalog
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the real dispatcher, join,
  bootstrap, publish, and manifest checks in disposable directories. They
  do not establish installed-client reload, live cross-client delivery,
  new-release publication, or deployment approval. Those remain separate
  release checks.
