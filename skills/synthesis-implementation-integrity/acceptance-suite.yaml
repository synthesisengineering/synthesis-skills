cases:
- id: overlap-service
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-chief-of-staff/scripts/test_overlap.py::test_validate_accepts_well_formed_layer
  motivating_defect: Cross-workspace collisions were checked by hand or not
    at all; the overlap service must report cross-owner pairs from the
    shared layer deterministically, reading without writing.
- id: ownership-routing
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-daily-rituals/scripts/test_ownership_routing.py::test_layer_path_contract_matches_overlap_script
  motivating_defect: Owned items double-surfaced across seats; triage must
    route by rule, stamp owner and rule, publish blocks, and fail closed
    to candidates.
- id: owner-stamp
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-meeting-transcripts/test_extract_commitments.py::test_stamp_prints_owner_lines
  motivating_defect: Confirmed commitments carried no ownership; the stamp
    must print owner lines and refuse blank owners and unknown rules.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
