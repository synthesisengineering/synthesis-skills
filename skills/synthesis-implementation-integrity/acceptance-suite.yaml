# AGENT HEURISTIC: authored for the 4.84.0 stable-path doctor transaction.
# Fresh per transaction: changed_surfaces must equal the authoritative
# base-to-head Git diff before release.py can consume the receipt.
schema: 2
suite: stable-path-daily-heartbeat
membership: closed
production_entry_point: skills/synthesis-agent-conformance/scripts/conformance.py
enforcing_boundary: the daily parity check fails when the stable plugin path is missing, dangling, or carries a version other than the one the client reports installed
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: the live parity run on this machine after install is quoted in the release record; a pointer that resolves correctly but to a tree whose contents drifted from the manifest is covered by the release's byte verification, not by this check
changed_surfaces:
  - path: skills/synthesis-agent-conformance/scripts/conformance.py
    cases: [stable-path-current, stable-path-missing, stable-path-dangling, stable-path-behind]
  - path: skills/synthesis-agent-conformance/scripts/test_parity.py
    cases: [stable-path-current, stable-path-missing, stable-path-dangling, stable-path-behind]
  - path: skills/synthesis-agent-conformance/scripts/test_conformance.py
    cases: [stable-path-current]
  - path: skills/synthesis-skills-manager/SKILL.md
    cases: [two-caller-rule-documented]
  - path: skills/synthesis-skills-manager/scripts/test_release.py
    cases: [two-caller-rule-documented]
  - path: skills/synthesis-daily-rituals/SKILL.md
    cases: [rituals-budget]
  - path: skills/synthesis-daily-rituals/references/version-history.md
    cases: [rituals-budget]
  - path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
    cases: [shipped-manifest-self-consumption]
  - path: .claude-plugin/plugin.json
    cases: [release-manifest-parity]
  - path: .codex-plugin/plugin.json
    cases: [release-manifest-parity]
  - path: CHANGELOG.md
    cases: [release-changelog-parity]
  - path: README.md
    cases: [release-changelog-parity]
cases:
  - id: stable-path-current
    control_class: acceptance-test
    fixture: ../synthesis-agent-conformance/scripts/test_parity.py::ParityTests::test_everything_current_passes
    motivating_defect: a-check-that-cannot-pass-on-a-healthy-machine-trains-bypass
  - id: stable-path-missing
    control_class: enforced-gate
    fixture: ../synthesis-agent-conformance/scripts/test_parity.py::ParityTests::test_missing_stable_path_fails
    motivating_defect: a-pointer-nobody-created-is-a-pin-that-resolves-to-nothing
  - id: stable-path-dangling
    control_class: enforced-gate
    fixture: ../synthesis-agent-conformance/scripts/test_parity.py::ParityTests::test_dangling_stable_path_fails
    motivating_defect: the-client-replaces-its-cache-on-its-own-schedule-and-a-symlink-into-it-dangles
  - id: stable-path-behind
    control_class: enforced-gate
    fixture: ../synthesis-agent-conformance/scripts/test_parity.py::ParityTests::test_stable_path_behind_installed_fails
    motivating_defect: an-install-made-without-the-gated-release-leaves-the-pointer-on-yesterdays-version
  - id: two-caller-rule-documented
    control_class: acceptance-test
    fixture: ../synthesis-skills-manager/scripts/test_release.py::test_stable_path_doc_states_the_two_caller_rule
    motivating_defect: a-rule-nobody-wrote-down-gets-re-decided-per-session
  - id: rituals-budget
    control_class: acceptance-test
    fixture: ../synthesis-daily-rituals/scripts/test_skill_documents.py::test_rituals_skill_document_stays_within_repo_budget
    motivating_defect: a-restructured-document-must-not-regrow-with-its-next-feature
  - id: shipped-manifest-self-consumption
    control_class: acceptance-test
    fixture: ../synthesis-implementation-integrity/scripts/test_acceptance_suite.py::test_shipped_manifest_validates
    motivating_defect: an-acceptance-manifest-that-its-own-runner-cannot-consume-issues-authority-it-never-earned
  - id: release-manifest-parity
    control_class: acceptance-test
    fixture: ../synthesis-skills-manager/scripts/test_release.py::test_source_version_agrees
    motivating_defect: a-version-that-reaches-only-one-client-manifest-cannot-be-reliably-installed-or-audited
  - id: release-changelog-parity
    control_class: acceptance-test
    fixture: ../synthesis-skills-manager/scripts/test_release.py::test_changelog_top_version_parsed
    motivating_defect: a-release-whose-changelog-disagrees-with-its-manifests-cannot-be-audited-later
