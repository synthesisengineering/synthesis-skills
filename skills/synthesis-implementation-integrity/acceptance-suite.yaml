schema: 2
suite: skill-output-provenance-4-121-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.121.0, shipping decision-packet 1.5.0 (generator provenance
  marker; rulings require a filed spec), conformance 1.11.0 (shared
  skill-outputs checker) and lifecycle 1.20.0 (context-doctor
  skill-outputs check)
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the generator, the rulings gate,
  the checker and the doctor in disposable directories. They do not
  establish installed-client reload, live cross-client delivery,
  new-release publication, or deployment approval. Those remain separate
  release checks.
