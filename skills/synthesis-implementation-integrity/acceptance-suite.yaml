schema: 2
suite: autopilot-gate-harden-4-144-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.144.0, shipping autopilot 2.4.0 with read-only gate status,
  verified cron continuations, scratch-only close refusal, and the
  per-agent search cap.
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: The fixtures execute release-contract, gate, registry,
  and manifest checks against fixtures and the working tree. They do not establish
  live cron fires, installed-client reload, live cross-client delivery,
  new-release publication, launcher refresh, or deployment approval. Those
  remain separate release checks. The skill prose rides the
  release-metadata vehicle; review is the evidence of prose adoption. The full
  autopilot suite runs in the required pytest checks alongside this receipt.
changed_surfaces:
- path: .claude-plugin/plugin.json
  cases:
  - release-version-metadata
- path: .codex-plugin/plugin.json
  cases:
  - release-version-metadata
- path: .muse-plugin/plugin.json
  cases:
  - release-version-metadata
- path: CHANGELOG.md
  cases:
  - release-version-metadata
- path: README.md
  cases:
  - release-version-metadata
- path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
  cases:
  - manifest-validates
- path: skills/synthesis-autopilot/SKILL.md
  cases:
  - release-version-metadata
- path: skills/synthesis-autopilot/scripts/autopilot_gate.py
  cases:
  - gate-status-readonly
  - cron-verified-before-trusted
  - close-refuses-scratch-cites
- path: skills/synthesis-autopilot/scripts/test_autopilot_gate.py
  cases:
  - gate-status-readonly
  - cron-verified-before-trusted
  - close-refuses-scratch-cites
- path: skills/synthesis-autopilot/scripts/search_budget.py
  cases:
  - search-budget-pre-dispatch
- path: skills/synthesis-autopilot/scripts/test_search_budget.py
  cases:
  - search-budget-pre-dispatch
cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid. The autopilot prose rides this vehicle; review
    is the evidence of prose adoption.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: gate-status-readonly
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-autopilot/scripts/test_autopilot_gate.py::test_status_reports_state_without_mutating
  motivating_defect: No subcommand showed engagement state, so the only way
    to inspect an engagement was reading raw registry JSON. Status reports
    mission, state, continuation, blocker, and cycle count, and the test
    proves the record bytes are identical before and after.
- id: cron-verified-before-trusted
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-autopilot/scripts/test_autopilot_gate.py::test_cron_continuation_blocks_gate_when_unverified_and_aged
  motivating_defect: A scheduled re-entry counted as a continuation the
    moment it was named, so a cron job that never fired still released the
    Stop gate. Cron continuations now name the on-disk job, stay unverified
    until the first observed fire, and block past a 60-minute grace.
- id: close-refuses-scratch-cites
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-autopilot/scripts/test_autopilot_gate.py::test_close_refuses_scratch_only_citations
  motivating_defect: An engagement could close while its evidence lived only
    in scratch directories, which reboots and session ends clear. Close now
    scans the plan for cited absolute paths and refuses while any exist only
    under scratch roots.
- id: search-budget-pre-dispatch
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-autopilot/scripts/test_search_budget.py::test_unset_cap_fails_closed_with_remedy
  motivating_defect: Six parallel research agents silently exhausted one
    shared session-wide search budget because each assumed its own. The
    per-agent cap lives in the shell and the pre-dispatch check fails closed
    with the export remedy when it is unset.
