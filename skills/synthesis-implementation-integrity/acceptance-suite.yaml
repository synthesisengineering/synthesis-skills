schema: 2
suite: project-format-v2-4-113-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.113.0, shipping versioned project formats (v1/v2) with
  the project_format detect/migrate/verify engine, the v2.16.0
  project-management format contract, and resume-probe v2 reporting
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the real detector, migration,
  probe, and manifest checks in disposable directories. They do not
  establish installed-client reload, live cross-client delivery,
  new-release publication, or deployment approval. Those remain
  separate release checks.
