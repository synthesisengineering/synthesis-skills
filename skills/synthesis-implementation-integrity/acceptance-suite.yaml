# Transaction-bound acceptance for non-mutating continuity diagnostics.
# Red fixture commits: 8093689 (parity), 49450f6 (mutation policy), 48b1af2 (inbox).
schema: 2
suite: continuity-diagnostics-2026-09-06
membership: closed
production_entry_point: conformance active and stopped payload parity through session_context diagnostic mode
enforcing_boundary: release.py consumes exact base-to-head acceptance before publication and dual-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: parity compares locally read evidence, not remote freshness or actual client delivery; independent concurrent writes may cause divergence; other conformance checks may refresh state; installed preservation and genuine new-version startup require separate acceptance
changed_surfaces:
  - path: .claude-plugin/plugin.json
    cases: [release-contract]
  - path: .codex-plugin/plugin.json
    cases: [release-contract]
  - path: CHANGELOG.md
    cases: [release-contract]
  - path: README.md
    cases: [release-contract]
  - path: skills/synthesis-agent-conformance/SKILL.md
    cases: [parity-unread, diagnostic-lifecycle]
  - path: skills/synthesis-agent-conformance/scripts/active_project.py
    cases: [pointer-policy]
  - path: skills/synthesis-agent-conformance/scripts/conformance.py
    cases: [parity-unread, parity-negative, parity-error, active-integration, cold-cli, malformed-cli]
  - path: skills/synthesis-agent-conformance/scripts/session_context.py
    cases: [parity-unread, parity-error, diagnostic-lifecycle, resolver-policy, active-policy, normal-lifecycle, receipt-order]
  - path: skills/synthesis-agent-conformance/scripts/test_diagnostic_parity.py
    cases: [parity-unread, parity-negative, parity-error, normal-lifecycle, active-integration, cold-cli, malformed-cli]
  - path: skills/synthesis-agent-conformance/scripts/test_diagnostic_mode.py
    cases: [diagnostic-lifecycle, resolver-policy, pointer-policy, active-policy]
  - path: skills/synthesis-agent-conformance/scripts/test_session_context.py
