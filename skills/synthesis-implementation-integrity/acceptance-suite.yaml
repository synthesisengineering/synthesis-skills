cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid. The doctrine prose rides this vehicle; review
    is the evidence of prose adoption.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: r5-names-failing-cases
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_runner_failure_detail_names_unmatched_cases
  motivating_defect: Runner receipts end in a bare brace, so every R5 failure rendered as
    a lone closing brace. The gate now names the unmatched cases and the
    first error instead.
- id: ci-base-steps-back-on-raced-tag
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_ci_runtime.py::test_base_resolution_steps_back_when_tag_raced_ci
  motivating_defect: When the release tag beats CI onto the remote, grading against it diffs
    HEAD against itself and R5 fails deterministically (4.138.0, 4.139.0). The step
    now steps back to the previous release tag in that case.
- id: onboarding-copy-idle-margin
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_native_failure_boundary.py::test_copy_watchdog_keeps_the_sixty_second_stall_boundary
  motivating_defect: The copy watchdog's 25-second idle bound timed out a healthy copy
    whose loaded-runner preamble had not produced its first receipt (4.138.0, 4.139.0).
    Sixty seconds absorbs the variance while still bounding a true hang.
