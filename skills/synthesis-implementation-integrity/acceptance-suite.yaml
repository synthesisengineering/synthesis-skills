schema: 2
suite: ecosystem-reliability-source-candidate-2026-09-16-public
membership: closed
production_entry_point: Shared coordination/session recovery, archive and retirement CLI, local repo checks,
  pre-commit policy validation and verified public release execution
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and both-client installation;
  source-candidate validation alone has no authority
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: This manifest declares a source candidate, with existing version labels; it does
  not establish a completed release, installed bytes, both-client installation parity, genuine native
  SessionStart/PostToolUse/Stop delivery, hook trust, multi-computer readiness or production remote transport/contended
  operation. No publication, deployment, billing, disclosure or policy-activation authority follows from
  it. Codex must not merge or activate the changed hooks. The Claude handoff must add the actual release
  metadata, obtain release-train ownership, regenerate exact changed-surface membership including those
  changes, rerun all required CI groups and fresh closed acceptance through the gated release scripts,
  then complete the separate human hook-trust step. This declaration covers only changes from the named
  review baseline to the eventual clean committed candidate; the real consumer still supplies and verifies
  its own authoritative change base and transaction. Static manifest validation and AST-resolvable selectors
  are not passing execution evidence. Parameterized selectors cover every fixture parameter when actually
  run; pytest output must be inspected for skips or xfails because this runner classifies subprocess exit
  codes. The selected fixtures do not replace full CI or the package independent-review dispositions.
  The candidate review base is 13b7907. Temporary Git repositories and local bare remotes exercise grammar,
  ownership/freshness, archive CAS/recovery and retirement, not the user coordination board. Cache and
  thread-pool tests establish semantic boundaries and bounded fixture behavior, not native-client latency.
  The canonical-JSON fixtures are relocated evidence and scalar vectors. Contract Markdown is linked to
  tests of the documented behavior, not a test of every sentence. The ritual document cases read its instruction
  budget and reference links; they do not prove an agent actually invokes archive or private orphan-snapshot
  maintenance. The public declaration cannot execute private-repository pruning fixtures. Direct-copy
  tests execute the actual shell boundary in disposable source/target roots; they do not operate either
  installed client. D09 release/interpreter fixtures use temporary release pointers and launchers and
  do not activate the real managed launcher or prove an existing native session has adopted it. Separate
  installed/native acceptance remains required.
