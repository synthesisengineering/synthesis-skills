schema: 2
suite: defect3-main-advance
membership: closed
production_entry_point: retire_worktree.py fast-forwards the main worktree
  to the verified base before removing anything, refusing on dirty,
  diverged, or ahead checkouts
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the real helper against disposable
  git remotes and clones. They do not establish installed-client reload,
  live hook pickup, new-release publication, or deployment approval. Those
  remain separate release checks.
changed_surfaces:
- path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
  cases:
  - manifest-validates
- path: skills/synthesis-project-management/scripts/retire_worktree.py
  cases:
  - defect3-main-advance
  - defect3-dirty-refusal
  - defect3-diverged-refusal
- path: skills/synthesis-project-management/scripts/test_retire_worktree.py
  cases:
  - defect3-main-advance
  - defect3-dirty-refusal
  - defect3-diverged-refusal
cases:
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: defect3-main-advance
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_retire_worktree.py::test_retirement_advances_behind_main_worktree
  motivating_defect: A branch verified on the remote while the operator's
    main checkout sits behind leaves the next session reading stale files;
    retirement must advance the main checkout itself.
- id: defect3-dirty-refusal
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_retire_worktree.py::test_retirement_refuses_dirty_main_worktree
  motivating_defect: The advance must never touch a dirty tree; retirement
    refuses with remediation and removes nothing.
- id: defect3-diverged-refusal
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_retire_worktree.py::test_retirement_refuses_diverged_main_worktree
  motivating_defect: A diverged main checkout cannot fast-forward; retirement
    refuses rather than merging or resetting the operator's work.
