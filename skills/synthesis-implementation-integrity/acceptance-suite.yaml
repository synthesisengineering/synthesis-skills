cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: onboard-fresh
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_onboard_flow.py::test_fresh_install_runs_setup_then_fleet
  motivating_defect: One bare command must carry a fresh Mac from
    install through the fleet decision with no scenario flags.
- id: onboard-menu
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_onboard_flow.py::test_menu_dispatches_each_action
  motivating_defect: An installed Mac gets a recommended menu over
    fleet, update, workspaces, components, and verify instead of a
    dozen commands to memorize.
- id: setup-inline-join
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_fleet_join.py::test_setup_absent_runs_setup_inline_then_joins
  motivating_defect: Enrollment verified green on a machine with no
    synthesis installation; the join must set the Mac up inline and
    continue instead of refusing or half-provisioning.
- id: label-collision
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_fleet_join.py::test_join_resolves_collision_before_bootstrap
  motivating_defect: A new Mac arriving with a taken name must be
    offered the first free variant, never enrolled as an ambiguous
    duplicate or refused without a path.
- id: rename-reconcile
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_fleet_join.py::test_reconcile_rename_end_to_end_with_real_engine
  motivating_defect: A renamed Mac must be offered a relabel that
    publishes; explicit labels are never touched and ties keep the
    stable name.
- id: concurrent-publish
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_bootstrap.py::test_publish_recovers_concurrent_enrollment
  motivating_defect: Two Macs publishing at once dead-ended the
    second on a non-fast-forward push; the recovery re-unions at the
    data level and pushes cleanly.
- id: enroll-guards
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_bootstrap.py::test_enroll_live_label_dupe_refused
  motivating_defect: Duplicate live labels and silent role changes
    corrupt fleet identity; enrollment refuses both with the remedy.
- id: identity-provenance
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_fleet_identity.py::test_enroll_records_provenance_and_reenrollment_preserves_it
  motivating_defect: Rename recovery needs to know how a label was
    chosen; provenance is recorded at enroll and preserved across
    re-enrollment.
- id: pipe-safe-prompts
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_fleet_join.py::test_prompts_validate_and_name_the_flag
  motivating_defect: Questions asked through a piped stdin read script
    bytes or EOF; prompts must use the controlling terminal so the
    one-command install can interview.
- id: cli-onboard
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_onboard_flow.py::test_cli_registers_onboard
  motivating_defect: The dispatcher must be registered on the stable
    CLI with capability-manifest parity, or help and gates drift.
- id: one-command-docs
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_onboard_flow.py::test_cli_registers_onboard
  motivating_defect: The documented one-command procedure must name a
    registered stable command or help and gates drift from the docs.
- id: engine-version
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_synthesis_cli.py::test_engine_versions_and_skill_contract_agree
  motivating_defect: The dispatcher ships as onboarding engine 2.7.0
    with both engine markers and the skill version in agreement.
- id: bare-default-onboards
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_whole_system_onboarding_release_contract_is_public_and_coherent
  motivating_defect: The bare installer must onboard (detect, recommend,
    interview), not merely set up; the release contract pins the new
    default command.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: meeting-prep-lint
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-meeting-prep/scripts/test_prep_lint.py::test_clean_pack_passes
  motivating_defect: Prep packs regress into word salad, register leaks,
    and missing bases without a mechanical backstop; the linter holds
    the checkable half of the content contract.
- id: catalog-registered
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_onboard.py::WholeSystemTests::test_every_hard_stop_has_a_real_scaffold
  motivating_defect: A new skill invisible to the component catalog
    breaks the release gate and modular installs; the audit proves
    every live skill is cataloged.
