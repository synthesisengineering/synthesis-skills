cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: ritual-doc-budget
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-daily-rituals/scripts/test_skill_documents.py::test_rituals_skill_document_stays_within_repo_budget
  motivating_defect: The ritual step must point at the public pruner path without breaking the document budget.
- id: pm-doc-budget
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_coordination.py::test_skill_document_stays_within_repo_budget
  motivating_defect: The landing reference must stay linked and the skill document within budget.
- id: snapshot-pruning
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_prune_tool_snapshots.py::test_retired_old_snapshot_is_verified_and_moved
  motivating_defect: Age alone never proves an orphan; only a uniquely identified released seat, no pending
    manifest, and verified archive bytes qualify a snapshot for removal.
- id: explicit-push-landing
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_canonical_landing.py::test_real_push_lands_and_restores_only_own_authority
  motivating_defect: Only one literal push to main lands, and only its own admitted authority is restored after.
