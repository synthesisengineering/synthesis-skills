schema: 2
suite: claim-merge-ritual-s5
membership: closed
production_entry_point: coordination.py claim merges by default with an
  explicit narrow verb; the ritual email step sweeps a mailbox manifest
  with blind/unreachable states; saved transcripts get a commitment scan
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the real coordination engine,
  mailbox planner, and commitment scanner against disposable boards,
  stores, and transcripts. They do not establish installed-client
  reload, live hook pickup, new-release publication, or deployment
  approval. Those remain separate release checks.
