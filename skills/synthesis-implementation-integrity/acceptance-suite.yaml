schema: 2
suite: idle-holder-narrow-4-123-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.123.0, shipping the idle-holder narrow (request-narrow plus
  the honor pass plus administrative escalation under the standing
  direction), per-execution launcher verification with receipt mode, the
  announced SessionStart refusal, claim-glob parse fidelity, and the
  third-party reader promise
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the request, honor, escalation,
  receipt, digest, refusal, and parse paths in disposable directories.
  They do not establish installed-client reload, live cross-client
  delivery, new-release publication, or deployment approval. Those remain
  separate release checks.
