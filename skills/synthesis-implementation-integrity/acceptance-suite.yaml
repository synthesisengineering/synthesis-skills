  - path: skills/synthesis-project-management/SKILL.md
    cases: [inbox-unread]
  - path: skills/synthesis-project-management/scripts/board_inbox.py
    cases: [inbox-unread, inbox-board, inbox-absent, inbox-snapshot, inbox-permission, table-spacing, table-structure]
  - path: skills/synthesis-project-management/scripts/peer_addressing.py
    cases: [inbox-seat, inbox-ambiguous, inbox-watermark, inbox-permission, message-header, message-boundary, body-heading, empty-inbox, duplicate-json, seat-filename, protocol-annotation, unrelated-history, addressed-history, normal-grammar, normal-seat, legacy-boundary, legacy-scope, legacy-structure, native-key, native-message, unscoped-strict]
  - path: skills/synthesis-project-management/scripts/test_diagnostic_inbox.py
    cases: [inbox-unread, inbox-board, inbox-absent, inbox-snapshot, inbox-permission, inbox-seat, inbox-ambiguous, inbox-watermark, message-header, message-boundary, body-heading, empty-inbox, duplicate-json, seat-filename, protocol-annotation, unrelated-history, addressed-history, normal-grammar, normal-seat, legacy-boundary, legacy-scope, legacy-structure, native-key, native-message, unscoped-strict, table-spacing, table-structure]
  - path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
    cases: [acceptance-self]
