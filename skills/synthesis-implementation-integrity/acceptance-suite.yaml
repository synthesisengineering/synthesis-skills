cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: provenance-marker-emitted
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-decision-packet/scripts/test_build_packet.py::test_build_emits_a_verifiable_provenance_marker
  motivating_defect: A hand-authored packet page is indistinguishable from
    generator output, so freelanced substitutes ship as skill output. Every
    generated page carries a marker pinning its embedded spec.
- id: rulings-require-filed-spec
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-decision-packet/scripts/test_build_packet.py::test_record_rulings_refuses_a_paste_with_no_filed_spec
  motivating_defect: A paste against a bare hand-made page could still
    become a rulings file, graduating an unverifiable page to a closed
    record. Rulings file only against a spec the generator filed.
- id: unmarked-live-page-defect
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_skill_outputs.py::test_unmarked_live_page_is_a_defect
  motivating_defect: Unmarked live packet pages sat in project artifacts
    with no check naming them. The shared checker fails them as defects
    with a rebuild-or-remove remedy.
- id: doctor-skill-outputs
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-context-lifecycle/scripts/test_context_doctor.py::SkillOutputsTests::test_hand_made_live_packet_is_a_defect
  motivating_defect: The enforcement must ride install, upgrade and doctor
    on every machine, not a local note. The context doctor fails
    hand-made live packets and warns on closed records only.
