schema: 2
suite: run-profiles-4-122-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.122.0, shipping autopilot 2.2.0 (run profiles resolve the
  standing checklist from layers, freeze it into the plan, and refuse a
  goals-met close until every item is done or waived aloud)
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: Fixtures execute the resolver, the verifier and the
  gate in disposable directories. They do not establish installed-client
  reload, live cross-client delivery, new-release publication, or
  deployment approval. Those remain separate release checks.
changed_surfaces:
- path: .claude-plugin/plugin.json
  cases:
  - release-version-metadata
- path: .codex-plugin/plugin.json
  cases:
  - release-version-metadata
- path: .muse-plugin/plugin.json
  cases:
  - release-version-metadata
- path: CHANGELOG.md
  cases:
  - release-version-metadata
- path: README.md
  cases:
  - release-version-metadata
- path: skills/synthesis-implementation-integrity/acceptance-suite.yaml
  cases:
  - manifest-validates
- path: skills/synthesis-autopilot/SKILL.md
  cases:
  - release-version-metadata
- path: skills/synthesis-autopilot/scripts/autopilot_gate.py
  cases:
  - profile-verify-close
- path: skills/synthesis-autopilot/scripts/run_profile.py
  cases:
  - profile-resolve-layers
  - profile-grant-from-speech-only
  - profile-verify-close
- path: skills/synthesis-autopilot/scripts/test_run_profile.py
  cases:
  - profile-resolve-layers
  - profile-grant-from-speech-only
  - profile-verify-close
cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: profile-resolve-layers
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-autopilot/scripts/test_run_profile.py::test_resolve_user_disables_and_adds
  motivating_defect: Retyped standing instructions drift and decay; each
    retelling drops a clause that silently doesn't happen. Layers resolve
    deterministically with provenance, and disabled items stay visible.
- id: profile-grant-from-speech-only
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-autopilot/scripts/test_run_profile.py::test_resolve_file_deploy_grant_ignored
  motivating_defect: A profile that could grant deployment authority from
    a file would let standing configuration override per-run principal
    approval. File-layer grants are forced to none; only the delegation
    message grants.
- id: profile-verify-close
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-autopilot/scripts/test_run_profile.py::test_verify_happy_path_and_close
  motivating_defect: A frozen checklist nobody verifies is prose again.
    Goals-met close requires every item done with evidence or waived
    aloud, and the plan hash binds the receipt.
