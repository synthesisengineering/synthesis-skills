cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: format-migrate
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_project_format.py::test_migrate_apply_adds_and_verifies
  motivating_defect: Format evolution without a mechanical migration
    strands old projects or breaks them mid-upgrade; the engine must
    add, verify, keep existing files, and roll back on failure.
- id: resume-probe-v2
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-resume/scripts/test_resume_probe.py::test_probe_reports_v2_marker
  motivating_defect: Resume cannot upgrade what it cannot see; the
    probe must report v2 and unknown markers, not just v1 layouts.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
