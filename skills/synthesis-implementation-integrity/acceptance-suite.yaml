schema: 2
suite: doctrine-ci-batch-4-140-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.140.0, teaching the multi-session coordination loop in
  synthesis-autopilot, fixing the CI change-base race when the release
  tag beats CI onto the remote, and naming failing cases in R5 output.
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: The fixtures execute release-contract, base-resolution, failure-message,
  and manifest checks against fixtures and the working tree. They do not establish
  installed-client reload, live cross-client delivery, new-release publication,
  launcher refresh, or deployment approval. Those remain separate release
  checks. The autopilot prose rides the release-metadata vehicle; review is the evidence
  of prose adoption. The full onboarding and skills-manager suites run in the
  required pytest checks alongside this receipt.
