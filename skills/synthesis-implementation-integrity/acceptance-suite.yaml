schema: 2
suite: promotion-pro-1-pro-2-4-128-0
membership: closed
production_entry_point: All three client manifests and the top changelog
  identify 4.128.0, promoting the snapshot pruner (opt-in ritual step)
  and the canonical-checkout landing hook (explicit-push trigger only)
  with the shell parser to supported public API.
enforcing_boundary: release.py consumes fresh schema-2 acceptance before publishing and all-client installation
receipt_consumer: synthesis-skills-manager.release.consume-acceptance.v1
change_base_policy: boundary-supplied-git-diff
expected_status: pass
metadata_class: acceptance-test
issues_authority_receipt: false
unverified_remainder: The fixtures execute pruner and landing paths in
  disposable directories and Git fixtures. They do not establish
  installed-client reload, live cross-client delivery, new-release
  publication, or deployment approval. Those remain separate release
  checks.
