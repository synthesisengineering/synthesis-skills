cases:
- id: release-version-metadata
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-skills-manager/scripts/test_release.py::test_deduplicated_archive_release_contract_is_public_and_coherent
  motivating_defect: All client manifests and the top changelog identify the same release while retained
    release contracts remain valid.
- id: engine-version-agrees
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_synthesis_cli.py::test_engine_versions_and_skill_contract_agree
  motivating_defect: The onboarding skill contract, the CLI engine, and
    the installer engine must agree on one version, or installs and
    prose describe different systems.
- id: manifest-validates
  control_class: acceptance-test
  expected_status: pass
  fixture: scripts/test_acceptance_suite.py::test_shipped_manifest_validates
  motivating_defect: The release gate consumes a closed exact changed-file universe with mapped fixture cases.
- id: s19-receipt-mode
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_release_runtime.py::test_receipt_fast_path_skips_the_tree_digest
  motivating_defect: A per-call full tree digest costs 34 ms on every
    hook call. The activation receipt fast-paths verification to
    descriptor, launcher, entrypoints, and a stat-walk.
- id: s19-activation-receipt
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_system_contract.py::test_activation_writes_a_receipt_that_fast_paths_later_calls
  motivating_defect: Without an activation-written receipt beside the
    descriptor, per-call checks cannot fast-path and fall back to the
    full digest; a rolled-back activation must drop its stale receipt.
- id: s19-doctor-plane
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-onboarding/scripts/test_synthesis_cli.py::test_launcher_verification_plane_reports_verified_and_drifted
  motivating_defect: The fast path trusts the receipt; only a doctor
    that re-hashes the tree catches a same-size-mode-mtime
    substitution. The plane reports verified, drifted, or refused.
- id: s19-digest-line
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_session_context.py::test_sessionstart_prepends_runtime_digest_line
  motivating_defect: A session that never runs doctor never learns its
    runtime drifted. SessionStart carries the full digest line once per
    session, verified or DRIFTED.
- id: s14-refused-line
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-agent-conformance/scripts/test_session_context.py::test_main_announces_a_no_pointer_failure_and_exits_zero
  motivating_defect: A refused briefing that says nothing leaves the
    model believing it was briefed. The hook prints REFUSED and exits
    0; only a receipt-write failure keeps exit 2.
- id: s13-request-honor
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_coordination.py::test_honor_narrows_clean_areas_and_replies
  motivating_defect: Paths held by an idle session stay locked until a
    human relays. A structured request is honored automatically when
    the holder next runs. Clean areas narrow off, dirty areas reply
    held, and unverifiable checkouts defer without a reply.
- id: s13-idle-escalation
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_coordination.py::test_idle_holder_narrow_escalates_an_old_quiet_request
  motivating_defect: An unanswered request with no escalation path is a
    polite deadlock. After 10 idle minutes with a quiet harness log
    and a clean checkout, the requester narrows administratively,
    recorded on the bus for the revived holder.
- id: s13-muse-inbox
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_board_inbox.py::test_muse_wrapper_delivers_and_consumes
  motivating_defect: Muse had SessionStart delivery but no per-turn
    event, so addressed messages waited a full session. The
    UserPromptSubmit inbox hook injects them every turn.
- id: s13-glob-parse
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_board_grammar.py::test_claim_globs_survive_the_table_parse_for_all_consumers
  motivating_defect: The table parse ate ** pairs across multi-glob
    claim cells, so exact-match verbs could not name what the row held
    and every re-serialization rewrote the file.
- id: s17-reader-promise
  control_class: acceptance-test
  expected_status: pass
  fixture: ../synthesis-project-management/scripts/test_project_format.py::test_reader_promise_is_stated_once_in_versioning
  motivating_defect: An interoperability promise scattered across
    prose drifts. Older format versions stay conformant targets
    forever, stated once in docs/spec/versioning.md and never cited
    as a pro of an internal change.
