selector_notes:
  codex: Full GPT-6 and GPT-6.1 model IDs are documented client selectors. Local client catalogs, API
    capabilities, account access, active selection, and effort are separate evidence planes. No client or
    API execution was performed for this refresh.
  claude-code: Full Claude API IDs are accepted on the Anthropic API route. Family aliases vary with client
    version, endpoint and configuration; Bedrock, Foundry and Google Cloud deployments need their own
    selectors. Account access remains unknown.
  google: Role lists keep the LiteLLM gemini/ routing namespace used by existing consumers. The gemini-api
    client override supplies bare provider IDs for direct SDK use. Do not strip the prefix in LiteLLM. Google's
    model documentation moved from ai.google.dev to aistudio.google.com (the old page answers 301).
  ollama: Tags are documented on each model's tag page. Installed model files, memory fit at requested context,
    runtime performance and readiness were not tested. Tags Ollama publishes only as cloud models (:cloud) are
    not listed; they run on Ollama's servers, not locally.
  unverified_clients: Muse Code, Cursor and other clients have no verified selector override in this refresh.
    Missing entries do not establish availability or authorize changing an explicit user choice.
excerpt_normalization: whitespace only; excerpts are short documentation evidence, not runtime acceptance
